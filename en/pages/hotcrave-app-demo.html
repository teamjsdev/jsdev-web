<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HotCrave Demo QR Code</title>
    <meta name="description" content="HotCrave demo QR code for Google Play review.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fffaf5;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #6f6259;
            font-size: 16px;
            line-height: 1.5;
        }

        .qr-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .qr-card img {
            display: block;
            width: 100%;
            max-width: 320px;
            height: auto;
            margin: 0 auto;
        }

        .instruction {
            margin: 24px 0 0;
            font-size: 16px;
            font-weight: 600;
        }

        .note {
            margin: 12px 0 0;
            color: #6f6259;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<main class="container">

    <div class="brand">HOTCRAVE</div>

    <p class="subtitle">
        Demo QR code for Google Play review
    </p>

    <div class="qr-card">

        <!-- Replace this image with the actual HotCrave business QR code -->
        <img
            src="../../assets/img/hotcrave-demo-qr.png"
            alt="HotCrave demo business QR code"
        >

        <p class="instruction">
            Scan this QR code with the HotCrave app.
        </p>

        <p class="note">
            Open the QR scanner from the Following screen to test the
            business discovery and following flow.
        </p>

    </div>

</main>

</body>
</html>
