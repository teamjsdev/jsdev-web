<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calentitos</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 520px; width: 100%; text-align: center; }
    h1 { margin-bottom: 12px; }
    p { line-height: 1.5; opacity: .8; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    a { display: inline-block; padding: 12px 18px; border-radius: 10px; text-decoration: none; border: 1px solid currentColor; }
    .primary { background: currentColor; color: Canvas; }
  </style>
</head>
<body>
<main id="app">
  <h1>Calentitos</h1>
  <p>La página solicitada no existe.</p>
</main>
<script>
  const match = window.location.pathname.match(/^\/hotcrave\/b\/([^/]+)\/?$/i);
  if (match) {
    const businessId = decodeURIComponent(match[1]);
    document.title = 'Abrir en Calentitos';
    document.getElementById('app').innerHTML = `
      <h1>Calentitos</h1>
      <p>Este código QR pertenece a un negocio de Calentitos.</p>
      <div class="actions">
        <a class="primary" href="https://play.google.com/store/apps/details?id=com.jsdev.hotcrave.food">Abrir / descargar la app</a>
      </div>
    `;
  }
</script>
</body>
</html>
