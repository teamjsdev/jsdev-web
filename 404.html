<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#aa3000">
  <title>Calentitos</title>
  <link rel="stylesheet" href="/hotcrave/b/styles.css">
</head>
<body>
<main id="app">
  <div class="content">
    <section class="card">
      <h2>Calentitos</h2>
      <p>Cargando…</p>
    </section>
  </div>
</main>
<script>
  const match = window.location.pathname.match(/^\/hotcrave\/b\/([^/]+)\/?$/i);
  const isAndroid = /Android/i.test(navigator.userAgent);

  if (!match) {
    document.querySelector('#app').innerHTML = '<div class="content"><section class="card"><h2>Calentitos</h2><p>La página solicitada no existe.</p><a class="button secondary" href="/">Ir al inicio</a></section></div>';
  } else if (isAndroid) {
    const businessId = decodeURIComponent(match[1]);
    const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.jsdev.hotcrave.food&referrer=' + encodeURIComponent('businessId=' + businessId);
    window.location.replace(playStoreUrl);
  } else {
    const script = document.createElement('script');
    script.src = '/hotcrave/b/app.js';
    script.defer = true;
    document.head.appendChild(script);
  }
</script>
</body>
</html>
